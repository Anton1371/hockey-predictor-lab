name: Update hockey scores and publish

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'update_results.py'
      - '.github/workflows/update-results.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: hockey-results-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      settled_ids: ${{ steps.update.outputs.settled_ids }}
      settled_summary: ${{ steps.update.outputs.settled_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update verified NHL and KHL scores
        id: update
        run: python update_results.py
      - name: Commit journal changes
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal.json
          git commit -m "Update verified hockey results and forecasts"
          git push
      - name: Notify about newly settled picks
        if: steps.update.outputs.settled_ids != ''
        uses: actions/github-script@v7
        env:
          SETTLED_IDS: ${{ steps.update.outputs.settled_ids }}
          SETTLED_SUMMARY: ${{ steps.update.outputs.settled_summary }}
        with:
          script: |
            const ids = process.env.SETTLED_IDS.split(',').filter(Boolean);
            if (!ids.length) return;
            const title = '🏒 Hockey Predictor Lab: рассчитаны новые прогнозы';
            const body = [
              'Автоматическое уведомление о новых завершённых прогнозах.',
              '',
              process.env.SETTLED_SUMMARY,
              '',
              'Идентификаторы записей: ' + ids.join(', '),
              '',
              'Панель: https://anton1371.github.io/hockey-predictor-lab/',
              '',
              'Это виртуальная статистика; реальные ставки не совершались.'
            ].join('\\n');
            const marker = '<!-- hockey-settled:' + ids.slice().sort().join(',') + ' -->';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100
            });
            if (issues.some(issue => issue.body && issue.body.includes(marker))) {
              core.info('Notification already exists for these settled records.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body: body + '\\n\\n' + marker,
              labels: ['automated-notification']
            });
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest journal and site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
